# Formatting and lint, separated from the build (#16).
#
# Three check runs: `format`, `format (windows)` and `lint`. The first two are
# spelled exactly as #16 fixes them, and the third names the platform for the
# same reason `test (windows)` does in the build workflow, so a reader of the
# required check list can tell which run covered which platform.
#
# They are here rather than in `.github/workflows/build.yml` because a formatting
# failure and a compile failure are different failures and the first must not
# hide the second. A required check is matched by its literal name, so a job
# renamed here silently stops being required: if a name changes,
# `docs/required-checks.md` changes in the same pull request.
name: Lint

on:
  pull_request:
  push:
    branches: [main]

# Read-only at the top level. No job here writes anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - name: Install the component this leg needs
        # rust-toolchain.toml carries no `components` key, on purpose: setting
        # one would take rustfmt and clippy away from a contributor whose rustup
        # installed them by default. So each leg installs what it needs, which
        # is what the comment in that file says the gate does.
        run: rustup component add rustfmt
      - name: Report the toolchain rust-toolchain.toml selected
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo fmt --version
      - name: Check the Rust with the formatter that belongs to it
        # rustfmt ships with the toolchain the tree pins, so this adds nothing to
        # the supply chain and cannot disagree with what a contributor runs.
        run: cargo fmt --all -- --check
      - name: Check the Markdown, and refuse a Python source with no formatter
        # `cargo fmt` reads Rust and nothing else. What is left is checked by
        # crates/indexwerk-checks, in the tree rather than in this file, so the
        # rules go through the gate like any other code and a contributor runs
        # exactly this command. The package is named rather than the workspace,
        # so this leg does not link the C interface's shared library to check
        # some text.
        run: cargo test -p indexwerk-checks --locked --test formatting

  format-windows:
    name: format (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the component this leg needs
        shell: bash
        run: rustup component add rustfmt
      - name: Report the toolchain rust-toolchain.toml selected
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo fmt --version
      - name: Check the Rust with the formatter that belongs to it
        shell: bash
        run: cargo fmt --all -- --check
      - name: Check the Markdown, and refuse a Python source with no formatter
        # This leg exists because of the line-ending policy of #13. A check that
        # judged line endings would report a clean tree as failing on whichever
        # platform it was not written on, and the only way to know it does not is
        # to run it on both. `.gitattributes` checks out LF everywhere; nothing in
        # the Markdown check reads a line ending, and this is where that is
        # demonstrated rather than asserted.
        shell: bash
        run: cargo test -p indexwerk-checks --locked --test formatting

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the component this leg needs
        run: rustup component add clippy
      - name: Report the toolchain rust-toolchain.toml selected
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo clippy --version
      - name: Lint the workspace with warnings denied
        # Denied rather than warned. A lint that only warns is a lint nobody
        # fixes, and the warning scrolls past in a log nobody reads. --all-targets
        # so that the tests are linted too, which is where most of this tree is.
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
