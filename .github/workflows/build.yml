# The first gate leg, and the one every other leg assumes (#15).
#
# Four check runs, named exactly as #15 fixes them: `build`, `test`,
# `build (floor toolchain)` and `test (windows)`. A required check is matched by
# its literal name, so a job renamed here silently stops being required and
# nothing reports that it happened. If a name changes, the required check list
# kept in the tree changes in the same pull request. That list is #19.
#
# The toolchain is installed with rustup rather than with a third-party action,
# so this workflow adds no action to the supply chain beyond the checkout that
# the tree already carries.
name: Build

on:
  pull_request:
  push:
    branches: [main]

# Read-only at the top level. No job here writes anything.
permissions:
  contents: read

# A newer push on the same ref supersedes an in-flight run. This is a build and
# a test, not a publish, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pinned toolchain. #12 is where the pin and the minimum supported
  # versions are declared and where this number moves; until it lands this
  # workflow is the only place either number exists, which is why both are here
  # rather than spelled into each job.
  PINNED_TOOLCHAIN: "1.97.0"
  # The floor. Edition 2024 puts it no lower than 1.85, which is the reason for
  # this value rather than a preference. #12 owns it.
  FLOOR_TOOLCHAIN: "1.85.0"
  # Warnings are errors, so a warning cannot accumulate quietly until nobody
  # reads the output.
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$PINNED_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$PINNED_TOOLCHAIN"
          rustc --version
      - name: Build the workspace with the lockfile frozen
        # --locked refuses to update Cargo.lock, so a manifest change that would
        # resolve differently reds this leg instead of resolving silently.
        run: cargo build --workspace --locked --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$PINNED_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$PINNED_TOOLCHAIN"
          rustc --version
      - name: Report the display and elevation state of this runner
        # The headless and unelevated birth requirement of #17 is a claim about
        # where the suite runs, so the state is printed in the log rather than
        # asserted in a document. It is read, never changed: nothing here sets
        # DISPLAY, drops privilege, or asks for any.
        run: |
          set -euo pipefail
          echo "DISPLAY=${DISPLAY:-unset}"
          echo "WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-unset}"
          echo "user=$(id -un) uid=$(id -u)"
          if [ "$(id -u)" -eq 0 ]; then
            echo "this runner is root"
          else
            echo "this runner is not root"
          fi
      - name: Run the whole test suite
        run: cargo test --workspace --locked

  build-floor:
    name: build (floor toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the floor toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$FLOOR_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$FLOOR_TOOLCHAIN"
          rustc --version
      - name: Build the workspace on the declared floor
        run: cargo build --workspace --locked --all-targets

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # The one exception to warnings-as-errors, granted on the one leg that
      # meets it. The MSVC linker prints an informational line on stdout
      # whenever it produces an import library for a cdylib, and
      # `linker_messages` reports that line as a warning. It says nothing about
      # this code and no change to this code removes it. The exception is not in
      # the crate source, because `linker_messages` does not exist on the floor
      # toolchain and an allow of a lint a compiler does not know is itself a
      # warning; putting it there would raise the minimum supported version as a
      # side effect of silencing a linker. Every other warning is still an error
      # on this leg.
      RUSTFLAGS: "-D warnings -A linker_messages"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PINNED_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$PINNED_TOOLCHAIN"
          rustc --version
      - name: Report the elevation state of this runner
        # Same purpose as the Linux leg. The query is read-only: it asks the
        # current token whether it is in the Administrators role and changes
        # nothing. It does not request elevation and cannot raise a consent
        # prompt.
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $admin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "user=$($identity.Name)"
          Write-Output "elevated=$admin"
      - name: Run the whole test suite
        shell: bash
        run: cargo test --workspace --locked
