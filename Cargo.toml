[workspace]
resolver = "3"

# Three shipped members, one per layer of docs/adr/0005-layering.md, and one
# member that ships to nobody. Adding a shipped one is a change to that record
# first and to this list second; the record says which is which and why the
# distinction exists.
members = [
    "crates/indexwerk-core",
    "crates/indexwerk-ffi",
    "crates/indexwerk-python",
    "crates/indexwerk-checks",
]

# No `license` or `license-file` key: the licence is an open decision on the
# tracker (#2, entry 1) and the file it names does not exist yet (#47). A key
# pointing at an absent file would be a claim this tree cannot back.
[workspace.package]
version = "0.0.0"
edition = "2024"
# The floor, and the only place it is written (#12). Edition 2024 does not
# compile below this, so the value is forced rather than preferred, and the
# reason it is not raised past the force is in CONTRIBUTING.md. cargo refuses a
# compiler older than this key, and the floor leg of the gate reads the value
# out of this file rather than carrying its own copy.
rust-version = "1.85.0"
repository = "https://github.com/iderex/indexwerk"
publish = false
